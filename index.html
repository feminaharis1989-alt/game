
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vice City Fan Game</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080c20;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #183b39;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  padding: 14px;
  background: #09091dcc;
  border: 1px solid #ff4db8;
  border-radius: 10px;
  line-height: 1.8;
  z-index: 2;
}

#hud h2 {
  color: #ff4db8;
  letter-spacing: 2px;
}

#mission {
  position: fixed;
  top: 15px;
  right: 15px;
  background: #09091dcc;
  border: 1px solid #00e5ff;
  border-radius: 10px;
  padding: 12px;
  z-index: 2;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 22px;
  z-index: 3;
  pointer-events: none;
}

.control-group {
  display: flex;
  gap: 9px;
  align-items: center;
}

.control-group button {
  width: 57px;
  height: 57px;
  border: 1px solid #ff4db8;
  border-radius: 13px;
  background: #11152dcc;
  color: white;
  font-size: 23px;
  pointer-events: auto;
  touch-action: none;
}

button:active {
  background: #ff4db8;
}

#start {
  position: fixed;
  inset: 0;
  background: #09091deF;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 5;
  text-align: center;
  padding: 20px;
}

#start h1 {
  font-size: clamp(35px, 8vw, 65px);
  color: #ff4db8;
  text-shadow: 0 0 20px #ff1493;
}

#start p {
  margin: 15px;
  color: #ddd;
}

#start button {
  background: #ff35a7;
  border: none;
  padding: 15px 35px;
  border-radius: 8px;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <h2>VICE CITY</h2>
  💰 Money: $<span id="money">0</span><br>
  🚗 Speed: <span id="speed">0</span> km/h<br>
  📦 Packages: <span id="packages">0</span>/5
</div>

<div id="mission">
  <b style="color:#00e5ff">MISSION</b>
  <p id="missionText">Collect 5 packages!</p>
</div>

<div id="controls">
  <div class="control-group">
    <button data-key="ArrowLeft">◀</button>
    <button data-key="ArrowRight">▶</button>
  </div>
  <div class="control-group">
    <button data-key="ArrowDown">▼</button>
    <button data-key="ArrowUp">▲</button>
  </div>
</div>

<div id="start">
  <h1>VICE CITY</h1>
  <p>Welcome to the neon streets.</p>
  <p>Drive around and collect all 5 packages.</p>
  <p>PC: Use arrow keys or WASD.</p>
  <p>Mobile: Use the screen controls.</p>
  <button id="play">START GAME</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const world = {
  width: 1800,
  height: 1400
};

const player = {
  x: 450,
  y: 450,
  angle: 0,
  speed: 0,
  maxSpeed: 4,
  color: "#ff38a5"
};

let money = 0;
let collected = 0;
let playing = false;
let camera = { x: 0, y: 0 };

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  keys[e.key] = true;

  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
  keys[e.key] = false;
});

// Mobile controls
document.querySelectorAll("[data-key]").forEach(button => {
  const key = button.dataset.key;

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
  });

  button.addEventListener("pointerup", () => {
    keys[key] = false;
  });

  button.addEventListener("pointerleave", () => {
    keys[key] = false;
  });

  button.addEventListener("pointercancel", () => {
    keys[key] = false;
  });
});

// City roads
const roads = [];

for (let x = 100; x < world.width; x += 300) {
  roads.push({x, y:0, w:90, h:world.height});
}

for (let y = 100; y < world.height; y += 300) {
  roads.push({x:0, y, w:world.width, h:90});
}

// Buildings
const buildings = [];

for (let x = 210; x < world.width; x += 300) {
  for (let y = 210; y < world.height; y += 300) {
    buildings.push({
      x: x,
      y: y,
      w: 130,
      h: 130,
      color: ["#bd547e","#5c658c","#cf8c66","#8061a9"][
        Math.floor(Math.random()*4)
      ]
    });
  }
}

// Package locations
const packages = [];

for (let i = 0; i < 5; i++) {
  packages.push({
    x: 145 + (i % 3) * 300,
    y: 145 + Math.floor(i / 3) * 300,
    collected: false
  });
}

function drawCity() {
  ctx.fillStyle = "#286451";
  ctx.fillRect(0,0,world.width,world.height);

  // Road surfaces
  roads.forEach(road => {
    ctx.fillStyle = "#353b49";
    ctx.fillRect(road.x,road.y,road.w,road.h);

    ctx.strokeStyle = "#b9a96b";
    ctx.lineWidth = 2;
    ctx.setLineDash([18,15]);

    if (road.w > road.h) {
      ctx.beginPath();
      ctx.moveTo(road.x,road.y+road.h/2);
      ctx.lineTo(road.x+road.w,road.y+road.h/2);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(road.x+road.w/2,road.y);
      ctx.lineTo(road.x+road.w/2,road.y+road.h);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  });

  // Buildings
  buildings.forEach(b => {
    ctx.fillStyle = "#172d36";
    ctx.fillRect(b.x+8,b.y+8,b.w,b.h);

    ctx.fillStyle = b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);

    ctx.fillStyle = "#ffe6ac";

    for(let x=b.x+15; x<b.x+b.w-10; x+=28) {
      for(let y=b.y+15; y<b.y+b.h-10; y+=28) {
        ctx.fillRect(x,y,10,10);
      }
    }
  });

  // Palm trees
  for(let x=50; x<world.width; x+=300) {
    for(let y=50; y<world.height; y+=300) {
      drawPalm(x,y);
    }
  }
}

function drawPalm(x,y) {
  ctx.fillStyle="#75452b";
  ctx.fillRect(x-3,y-3,6,14);

  ctx.strokeStyle="#18bc7a";
  ctx.lineWidth=5;

  for(let i=0;i<6;i++) {
    let a=i*Math.PI/3;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(
      x+Math.cos(a)*20,
      y+Math.sin(a)*20
    );
    ctx.stroke();
  }
}

function drawCar() {
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.angle);

  // Shadow
  ctx.fillStyle="#111";
  ctx.fillRect(-17,-10,40,25);

  // Car body
  ctx.fillStyle=player.color;
  ctx.fillRect(-20,-12,40,24);

  // Windows
  ctx.fillStyle="#75d9e5";
  ctx.fillRect(-7,-9,17,18);

  // Wheels
  ctx.fillStyle="#080808";
  ctx.fillRect(-14,-15,9,5);
  ctx.fillRect(7,-15,9,5);
  ctx.fillRect(-14,10,9,5);
  ctx.fillRect(7,10,9,5);

  // Headlights
  ctx.fillStyle="#fff6a1";
  ctx.fillRect(17,-9,4,6);
  ctx.fillRect(17,4,4,6);

  ctx.restore();
}

function drawPackages() {
  packages.forEach(p => {
    if(p.collected) return;

    ctx.fillStyle="#ffdc3d";
    ctx.fillRect(p.x-9,p.y-9,18,18);

    ctx.fillStyle="#ffffff";
    ctx.font="bold 14px Arial";
    ctx.fillText("$",p.x-4,p.y+5);
  });
}

function update() {
  if(!playing) return;

  const forward = keys["ArrowUp"] || keys["w"];
  const backward = keys["ArrowDown"] || keys["s"];
  const left = keys["ArrowLeft"] || keys["a"];
  const right = keys["ArrowRight"] || keys["d"];

  if(forward) player.speed += 0.13;
  if(backward) player.speed -= 0.13;

  player.speed *= 0.985;
  player.speed = Math.max(-2.5,Math.min(player.maxSpeed,player.speed));

  if(Math.abs(player.speed)>0.1) {
    if(left) player.angle -= 0.045;
    if(right) player.angle += 0.045;
  }

  const nextX = player.x + Math.cos(player.angle)*player.speed;
  const nextY = player.y + Math.sin(player.angle)*player.speed;

  // World boundaries
  if(nextX>20 && nextX<world.width-20) player.x=nextX;
  if(nextY>20 && nextY<world.height-20) player.y=nextY;

  // Package collection
  packages.forEach(p => {
    if(!p.collected &&
      Math.hypot(player.x-p.x,player.y-p.y)<30) {
      p.collected=true;
      collected++;
      money+=100;

      document.getElementById("money").textContent=money;
      document.getElementById("packages").textContent=collected;

      if(collected===5) {
        document.getElementById("missionText").textContent=
          "MISSION COMPLETE! +$500";
        money+=500;
        document.getElementById("money").textContent=money;
      }
    }
  });

  camera.x=player.x-canvas.width/2;
  camera.y=player.y-canvas.height/2;

  camera.x=Math.max(0,Math.min(world.width-canvas.width,camera.x));
  camera.y=Math.max(0,Math.min(world.height-canvas.height,camera.y));

  document.getElementById("speed").textContent=
    Math.round(Math.abs(player.speed)*30);
}

function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  drawCity();
  drawPackages();
  drawCar();

  ctx.restore();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

document.getElementById("play").addEventListener("click",()=>{
  playing=true;
  document.getElementById("start").style.display="none";
});

gameLoop();
</script>

</body>
  </html>
